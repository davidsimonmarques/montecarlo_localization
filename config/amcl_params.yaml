amcl_node:
  ros__parameters:
    # Frame IDs
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # Topics (independent from MCL to allow parallel operation)
    scan_topic: "/scan"
    map_topic: "/map"
    odom_topic: "/odom"
    pose_topic: "/amcl_pose"
    particlecloud_topic: "/amcl_particlecloud"

    # TF Publishing
    # Set to true when running standalone; set to false if running in parallel with MCL
    # to prevent conflicting map -> odom transforms in the TF tree.
    publish_tf: true

    # KLD-Sampling Adaptive Particle Filter Parameters (Dieter Fox 2001/2003)
    # The number of particles dynamically adapts between min_particles and max_particles
    # according to the spatial dispersion (occupied bins) and statistical error bounds.
    min_particles: 500
    max_particles: 5000
    kld_err: 0.05              # Max error epsilon between true distribution and particle distribution
    kld_z: 2.32635             # Standard normal quantile for 1 - delta (0.99 confidence)
    spatial_resolution_x: 0.5  # Bin resolution in X (meters)
    spatial_resolution_y: 0.5  # Bin resolution in Y (meters)
    spatial_resolution_theta: 0.17453 # Bin resolution in Theta (radians, ~10 degrees)

    update_min_d: 0.1          # Minimum translational movement to trigger scan update (meters)
    update_min_a: 0.1          # Minimum angular movement to trigger scan update (radians)
    resample_on_update: true   # Resample immediately after each sensor update

    # Odometry Motion Model Noise Parameters (alpha1 - alpha4)
    # alpha1: rotation noise from rotation
    # alpha2: rotation noise from translation
    # alpha3: translation noise from translation
    # alpha4: translation noise from rotation
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02

    # Sensor Model Parameters (Likelihood Field for LaserScan)
    # z_hit: weight of correct obstacle measurement
    # z_rand: weight of uniform random noise
    # sigma_hit: standard deviation of Gaussian hit model (meters)
    z_hit: 0.85
    z_rand: 0.15
    sigma_hit: 0.25
    min_range: 0.1
    max_range: 5.0
    beam_skip: 2               # Subsampling step for laser beams
    max_beams: 30             # Maximum number of laser beams evaluated per scan

    # Augmented MCL Recovery (Sensor Failure & Kidnapping Recovery)
    enable_recovery: true      # Active in AMCL
    alpha_slow: 0.001          # Decay rate for slow average weight filter
    alpha_fast: 0.1            # Decay rate for fast average weight filter
    recovery_max_prob: 0.2     # Maximum probability cap for random sample injection

    # Initial Pose Configuration
    auto_initialize: true              # Automatically initialize particles when map is received
    global_localization_on_start: true # true: spread particles across map; false: use initial pose
    initial_pose_x: 11.16
    initial_pose_y: -8.77
    initial_pose_yaw: -3.1232          # radians
    initial_cov_x: 0.25                # Variance in X (sigma = 0.5 m)
    initial_cov_y: 0.25                # Variance in Y (sigma = 0.5 m)
    initial_cov_yaw: 0.068             # Variance in Yaw (sigma ~ 15 degrees)
