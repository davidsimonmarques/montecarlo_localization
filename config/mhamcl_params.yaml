mhamcl_node:
  ros__parameters:
    # Frame IDs
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # Topics (independent from MCL/AMCL to allow concurrent operation)
    scan_topic: "/scan"
    map_topic: "/map"
    odom_topic: "/odom"
    pose_topic: "/mhamcl_pose"
    particlecloud_topic: "/mhamcl_particlecloud"

    # TF Publishing
    # Set to true when running standalone; set to false if running alongside another estimator
    publish_tf: true

    # Particle Configuration (alinhado ao artigo Villela et al. IEEE DASC 2025)
    enable_kld: false            # Desativa variação KLD para operar com N fixo como no artigo
    num_particles: 12000         # 12.000 partículas (idêntico ao MCL e MH-MCL para comparação justa)

    # KLD-Sampling Adaptive Particle Parameters (Dieter Fox / Villela et al. 2025)
    min_particles: 3000
    max_particles: 12000
    kld_err: 0.05              # Max error bound epsilon
    kld_z: 2.32635             # Standard normal quantile (0.99 confidence)
    spatial_resolution_x: 0.5  # Bin size in X (meters)
    spatial_resolution_y: 0.5  # Bin size in Y (meters)
    spatial_resolution_theta: 0.087 # Bin size in Theta (radians, ~10 degrees)

    update_min_d: 0.05          # Minimum translation to trigger update (meters)
    update_min_a: 0.05          # Minimum rotation to trigger update (radians)
    resample_on_update: true   # Resample immediately after observation update
    resample_interval: 1       # Number of scan updates between resamplings
    selective_resampling: true # Only resample when Neff < N * resample_threshold_ratio
    resample_threshold_ratio: 0.5 # Threshold ratio for Neff (Neff < N/2)

    # Odometry Motion Model Noise Parameters (alpha1 - alpha4)
    # alpha1: calibrado para derrapagem do Husky (skid-steer) no CoppeliaSim
    alpha1: 0.25
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05

    # Sensor Model Parameters (Likelihood Field for LaserScan)
    z_hit: 0.90
    z_rand: 0.10
    sigma_hit: 0.20
    min_range: 0.1
    max_range: 10.0
    beam_skip: 1
    max_beams: 60

    # MH-AMCL uses Mixed Resampling with recovery (Algorithm 3, lines 21-22 of Villela et al. 2025)
    enable_recovery: true      # Active in MH-AMCL
    alpha_slow: 0.002          # Decay rate for slow average weight filter (alinhado aos autores)
    alpha_fast: 0.08           # Fast learning rate (reativo para detectar perda e disparar recuperacao)
    recovery_max_prob: 0.08    # Injeção ágil de partículas aleatórias para escapar de simetrias locais e armadilhas

    # Initial Pose
    auto_initialize: true              # Initialize particles automatically upon receiving map
    global_localization_on_start: true # false: initialize around configured pose; true: global
    initial_pose_x: 11.16
    initial_pose_y: -8.77
    initial_pose_yaw: -3.1232          # radians
    initial_cov_x: 0.25                # Variance in X (sigma = 0.5 m)
    initial_cov_y: 0.25                # Variance in Y (sigma = 0.5 m)
    initial_cov_yaw: 0.068             # Variance in Yaw (sigma ~ 15 degrees)
