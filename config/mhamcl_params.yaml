mhamcl_node:
  ros__parameters:
    # Frame IDs
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # Topics (independent from MCL/AMCL to allow concurrent operation)
    scan_topic: "/scan"
    map_topic: "/map"
    odom_topic: "/odom"
    pose_topic: "/mhamcl_pose"
    particlecloud_topic: "/mhamcl_particlecloud"

    # TF Publishing
    # Set to true when running standalone; set to false if running alongside another estimator
    publish_tf: false

    # Particle Configuration (alinhado ao artigo Villela et al. IEEE DASC 2025)
    enable_kld: false            # Desativa variação KLD para operar com N fixo (12.000) como no artigo
    num_particles: 6000         # 12.000 partículas (idêntico ao MCL e MH-MCL para comparação justa)

    # KLD-Sampling Adaptive Particle Parameters (Dieter Fox / Villela et al. 2025)
    min_particles: 3000
    max_particles: 6000
    kld_err: 0.05
    kld_z: 2.32635             # Standard normal quantile (0.99 confidence)
    spatial_resolution_x: 0.5
    spatial_resolution_y: 0.5
    spatial_resolution_theta: 0.087

    update_min_d: 0.05
    update_min_a: 0.05
    resample_on_update: true
    resample_interval: 1
    selective_resampling: false
    resample_threshold_ratio: 0.5

    # Odometry Motion Model Noise Parameters (alpha1 - alpha4)
    # Calibrated from /odom against ground truth; linear std in MHMCLEngine.
    alpha1: 0.35
    alpha2: 0.10
    alpha3: 0.20
    alpha4: 0.10

    # Sensor Model Parameters (Likelihood Field for LaserScan)
    z_hit: 0.90
    z_rand: 0.10
    sigma_hit: 0.12
    min_range: 0.1
    max_range: 5.0
    beam_skip: 1
    max_beams: 50

    # MH-AMCL uses Mixed Resampling with recovery (Algorithm 3, lines 21-22 of Villela et al. 2025)
    enable_recovery: true
    alpha_slow: 0.001
    alpha_fast: 0.1
    recovery_max_prob: 0.02

    # Initial Pose
    auto_initialize: true              # Initialize particles automatically upon receiving map
    global_localization_on_start: false # false: initialize around configured pose; true: global
    initial_pose_x: 11.16
    initial_pose_y: -8.77
    initial_pose_yaw: -3.1232          # radians
    initial_cov_x: 0.01
    initial_cov_y: 0.01
    initial_cov_yaw: 0.068             # Variance in Yaw (sigma ~ 15 degrees)
