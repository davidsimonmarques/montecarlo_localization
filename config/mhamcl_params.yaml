mhamcl_node:
  ros__parameters:
    # Frame IDs
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # Topics (independent from MCL/AMCL to allow concurrent operation)
    scan_topic: "/scan"
    map_topic: "/map"
    odom_topic: "/odom"
    pose_topic: "/mhamcl_pose"
    particlecloud_topic: "/mhamcl_particlecloud"

    # TF Publishing
    # Set to true when running standalone; set to false if running alongside another estimator
    publish_tf: true

    # KLD-Sampling Adaptive Particle Parameters (Dieter Fox / Villela et al. 2025)
    min_particles: 500
    max_particles: 5000
    kld_err: 0.05              # Max error bound epsilon
    kld_z: 2.32635             # Standard normal quantile (0.99 confidence)
    spatial_resolution_x: 0.5  # Bin size in X (meters)
    spatial_resolution_y: 0.5  # Bin size in Y (meters)
    spatial_resolution_theta: 0.17453 # Bin size in Theta (radians, ~10 degrees)

    update_min_d: 0.1          # Minimum translation to trigger update (meters)
    update_min_a: 0.1          # Minimum rotation to trigger update (radians)
    resample_on_update: true   # Resample immediately after observation update

    # Odometry Motion Model Noise Parameters (alpha1 - alpha4)
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02

    # Sensor Model Parameters (Likelihood Field for LaserScan)
    z_hit: 0.85
    z_rand: 0.15
    sigma_hit: 0.25
    min_range: 0.1
    max_range: 5.0
    beam_skip: 2
    max_beams: 30

    # MH-AMCL uses Mixed Resampling with recovery (Algorithm 3, lines 21-22 of Villela et al. 2025)
    enable_recovery: true      # Active in MH-AMCL
    alpha_slow: 0.001          # Decay rate for slow average weight filter
    alpha_fast: 0.1            # Decay rate for fast average weight filter
    recovery_max_prob: 0.2     # Maximum probability cap for random sample injection

    # Initial Pose
    auto_initialize: true              # Initialize particles automatically upon receiving map
    global_localization_on_start: true # false: initialize around configured pose; true: global
    initial_pose_x: 11.16
    initial_pose_y: -8.77
    initial_pose_yaw: -3.1232          # radians
    initial_cov_x: 0.25                # Variance in X (sigma = 0.5 m)
    initial_cov_y: 0.25                # Variance in Y (sigma = 0.5 m)
    initial_cov_yaw: 0.068             # Variance in Yaw (sigma ~ 15 degrees)
